name: Fork

# The fork's tree is always upstream plus the overlay in tools/fork (FORK.md).
# `overlay` keeps that true on every change. `build` rebuilds each new upstream
# commit with the overlay and tests it with no write token, because the tests
# run upstream's code. `publish` runs only this fork's fork.mjs, pushes the same
# tree, and opens the pull request.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual syncs of main share one group, so an older sync never
# finishes after a newer one and closes its pull request.
concurrency:
  group: fork-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'sync' || github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/chhoumann/t3-pstack.git
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  overlay:
    name: Fork overlay matches upstream
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream
        run: git fetch --no-tags "$UPSTREAM" main
      - name: Verify HEAD is upstreamSha plus the overlay
        run: node tools/fork/fork.mjs verify

  build:
    name: Build and test the upstream sync
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Upstream's code runs in this job and can write its outputs, so publish
    # takes its code from the event and only compares against them.
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      tree: ${{ steps.build.outputs.tree }}
      checks: ${{ steps.build.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Fetch upstream
        run: git fetch --no-tags "$UPSTREAM" +main:refs/remotes/upstream/main
      # Drift on main is not a patch to redo: sync --repair would drop it.
      - name: Verify main is upstreamSha plus the overlay
        run: node tools/fork/fork.mjs verify
      # Writes sha, then tree and checks once upstream has moved, or
      # overlay=failed.
      - name: Build and check the sync commit
        id: build
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/sync.log"
          sha=$(git rev-parse refs/remotes/upstream/main)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if ! commit=$(node tools/fork/fork.mjs sync "$sha" 2> "$log"); then
            cat "$log"
            grep -q "no longer applies" "$log" || exit 1
            echo "overlay=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$commit" ]; then
            echo "main already carries $sha"
            exit 0
          fi
          git checkout -q "$commit"
          checks=passed
          bun install --frozen-lockfile || checks=failed
          bun tools/generate.mjs --check || checks=failed
          bun test tests/ --timeout 30000 || checks=failed
          node --test plugins/pstack/skills/*/scripts/test/*.test.mjs || checks=failed
          { echo "tree=$(git rev-parse "$commit^{tree}")"; echo "checks=$checks"; } >> "$GITHUB_OUTPUT"
      # A failed scheduled run is what notifies the owner.
      - name: Fail on a patch that no longer applies
        if: steps.build.outputs.overlay == 'failed'
        env:
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          echo "::error::A patch does not apply to upstream ${SHA:0:7}. Redo it for that commit (FORK.md, When a patch no longer applies)."
          exit 1

  publish:
    name: Open the upstream sync pull request
    needs: build
    if: needs.build.outputs.tree != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the upstream-sync/<sha> branch
      pull-requests: write # opens the sync pull request and closes the ones it supersedes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # GITHUB_TOKEN on purpose: it cannot push a commit that changes a
      # workflow, and what it pushes or opens starts no workflow, so no
      # upstream workflow runs here before a person reads it.
      - name: Push the sync branch and open its pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build.outputs.sha }}
          TREE: ${{ needs.build.outputs.tree }}
          CHECKS: ${{ needs.build.outputs.checks }}
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM" +main:refs/remotes/upstream/main
          sha=$(git rev-parse refs/remotes/upstream/main)
          if [ "$sha" != "$SHA" ]; then
            echo "upstream moved since the build job; the next run syncs it"
            exit 0
          fi
          checks=failed
          if [ "$CHECKS" = passed ]; then checks=passed; fi
          branch="upstream-sync/${sha:0:7}"
          # The newest pull request from this branch stands unless main's overlay
          # has changed its tree since. A closed one with the same tree was declined.
          number='' state='' draft=''
          existing=$(gh pr list --head "$branch" --state all --json number,state,isDraft,headRefOid \
            --jq 'first // empty | "\(.number) \(.state) \(.isDraft) \(.headRefOid)"')
          current=false
          if [ -n "$existing" ]; then
            read -r number state draft head <<< "$existing"
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha)" = "$TREE" ]; then
              # Already proposed. An open, passing one still retries the supersede
              # below, in case an earlier run failed partway through it.
              if [ "$state" != OPEN ] || [ "$checks" != passed ]; then
                echo "#$number already proposes this tree"
                exit 0
              fi
              current=true
            fi
          fi
          if [ "$current" = false ]; then
            commit=$(node tools/fork/fork.mjs sync "$sha")
            if [ "$(git rev-parse "$commit^{tree}")" != "$TREE" ]; then
              echo "::error::The rebuilt tree differs from the one the build job tested"
              exit 1
            fi
            gh auth setup-git
            # Forced: the branch carries only this job's commits.
            git push --force origin "$commit:refs/heads/$branch"
            body="$RUNNER_TEMP/body.md"
            {
              echo "Rebuilds upstream [\`${sha:0:7}\`](https://github.com/chhoumann/t3-pstack/commit/$sha) with this fork's overlay (FORK.md)."
              echo
              echo "The generator check, \`bun test tests/\`, and the skill script tests: **$checks** ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
              echo "No other workflow runs on a pull request this job opens. Close and reopen it to run \`ci.yml\` and the overlay check."
            } > "$body"
            if [ "$state" = OPEN ]; then
              gh pr edit "$number" --body-file "$body"
              if [ "$checks" = passed ] && [ "$draft" = true ]; then gh pr ready "$number"; fi
              if [ "$checks" = failed ] && [ "$draft" = false ]; then gh pr ready "$number" --undo; fi
            else
              flags=()
              [ "$checks" = passed ] || flags=(--draft)
              gh pr create --base main --head "$branch" "${flags[@]}" \
                --title "Sync upstream to ${sha:0:7}" --body-file "$body"
              number=$(gh pr view "$branch" --json number --jq .number)
            fi
            echo "published=$checks" >> "$GITHUB_OUTPUT"
          fi
          # Only a passing sync supersedes the others. Their branches stay, in
          # case one holds a fix.
          [ "$checks" = passed ] || exit 0
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"upstream-sync/\")) | select(.number != $number) | .number" |
            while read -r old; do
              gh pr close "$old" --comment "Superseded by #$number."
            done
      - name: Fail on a sync pull request whose checks failed
        if: steps.pr.outputs.published == 'failed'
        run: |
          echo "::error::The sync pull request is a draft: its generator check or tests failed."
          exit 1
