name: Fork

# The fork's tree is upstream plus the overlay in tools/fork (see FORK.md).
# `overlay` keeps that true on every change; `sync` proposes each new upstream
# commit, rebuilt with the overlay, as a pull request.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/chhoumann/t3-pstack.git

jobs:
  overlay:
    name: Fork overlay matches upstream
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream
        run: git fetch --no-tags "$UPSTREAM" main
      - name: Verify HEAD is upstreamSha plus the overlay
        run: node tools/fork/fork.mjs verify

  sync:
    name: Sync upstream
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the upstream-sync/<sha> branch
      pull-requests: write # opens the sync pull request
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true
      # Writes sha, branch, and either commit (with checks=passed|failed) or
      # overlay=failed. Nothing to write means upstream has not moved, or this
      # upstream commit already has its branch.
      - name: Build and check the sync commit
        id: build
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/sync.log"
          : > "$log"
          git fetch --no-tags "$UPSTREAM" main
          sha=$(git rev-parse FETCH_HEAD)
          branch="upstream-sync/${sha:0:7}"
          { echo "sha=$sha"; echo "branch=$branch"; } >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists"
            exit 0
          fi
          if ! commit=$(node tools/fork/fork.mjs sync "$sha" 2> "$log"); then
            cat "$log"
            echo "overlay=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$commit" ]; then
            echo "main already carries $sha"
            exit 0
          fi
          git checkout -q "$commit"
          checks=passed
          bun install --frozen-lockfile >> "$log" 2>&1 || checks=failed
          bun tools/generate.mjs --check >> "$log" 2>&1 || checks=failed
          bun test tests/ --timeout 30000 >> "$log" 2>&1 || checks=failed
          tail -n 200 "$log"
          { echo "commit=$commit"; echo "checks=$checks"; } >> "$GITHUB_OUTPUT"

      - name: Open the sync pull request
        if: steps.build.outputs.commit != ''
        env:
          SHA: ${{ steps.build.outputs.sha }}
          BRANCH: ${{ steps.build.outputs.branch }}
          COMMIT: ${{ steps.build.outputs.commit }}
          CHECKS: ${{ steps.build.outputs.checks }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "$COMMIT:refs/heads/$BRANCH"
          body="$RUNNER_TEMP/body.md"
          {
            echo "Rebuilds upstream [\`${SHA:0:7}\`](https://github.com/chhoumann/t3-pstack/commit/$SHA) with this fork's overlay (FORK.md)."
            echo
            echo "Generator check and tests on this commit: **$CHECKS**. \`ci.yml\` does not run on a pull request this workflow opens."
            echo
            echo "<details><summary>Log tail</summary>"
            echo
            echo '```text'
            tail -n 80 "$RUNNER_TEMP/sync.log"
            echo '```'
            echo
            echo "</details>"
          } > "$body"
          draft=()
          [ "$CHECKS" = passed ] || draft=(--draft)
          gh pr create --base main --head "$BRANCH" "${draft[@]}" \
            --title "Sync upstream to ${SHA:0:7}" --body-file "$body"

      # A failed scheduled run is what notifies the owner, so these fail the job.
      - name: Fail on an overlay that no longer applies
        if: steps.build.outputs.overlay == 'failed'
        env:
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          echo "::error::The overlay does not apply to upstream ${SHA:0:7}. Redo the failing change on it and regenerate its patch (FORK.md, Changing the fork)."
          cat "$RUNNER_TEMP/sync.log"
          exit 1
      - name: Fail on a sync commit whose checks failed
        if: steps.build.outputs.checks == 'failed'
        run: |
          echo "::error::The sync pull request is a draft: its generator check or tests failed."
          exit 1
